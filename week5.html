<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="ShopHub - A modern e-commerce product catalog built with HTML, CSS and JavaScript.">

    <meta name="keywords"
          content="ecommerce, products, online store, shopping">

    <meta name="author"
          content="Subash">

    <meta name="robots"
          content="index, follow">

    <title>ShopHub | E-Commerce Store</title>


    <style>

        /* =========================
           VARIABLES
        ========================== */

        :root {

            --primary: #2563eb;
            --primary-dark: #1d4ed8;

            --background: #f1f5f9;

            --surface: #ffffff;

            --text: #0f172a;

            --muted: #64748b;

            --border: #e2e8f0;

            --success: #16a34a;

            --danger: #dc2626;

        }


        /* =========================
           RESET
        ========================== */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                var(--background);

            color:
                var(--text);

            line-height: 1.6;

        }


        button,
        input,
        select {

            font: inherit;

        }


        button {

            cursor: pointer;

        }


        a {

            color: inherit;

            text-decoration: none;

        }


        /* =========================
           HEADER
        ========================== */

        header {

            background:
                var(--surface);

            border-bottom:
                1px solid var(--border);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .navbar {

            max-width: 1200px;

            margin: auto;

            padding:
                16px 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

        }


        .logo {

            font-size:
                1.5rem;

            font-weight:
                800;

            color:
                var(--primary);

        }


        .nav-links {

            display: flex;

            gap: 20px;

            list-style: none;

        }


        .nav-links a {

            font-weight:
                600;

        }


        .nav-links a:hover {

            color:
                var(--primary);

        }


        .cart-button {

            background:
                var(--primary);

            color:
                white;

            border: none;

            padding:
                10px 16px;

            border-radius:
                8px;

            font-weight:
                bold;

        }


        .cart-button:hover {

            background:
                var(--primary-dark);

        }


        /* =========================
           APP
        ========================== */

        #app {

            max-width:
                1200px;

            margin:
                auto;

            padding:
                35px 20px;

            min-height:
                80vh;

        }


        /* =========================
           HERO
        ========================== */

        .hero {

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #eff6ff
                );

            border-radius:
                20px;

            padding:
                60px 30px;

            text-align:
                center;

            margin-bottom:
                35px;

        }


        .hero h1 {

            font-size:
                clamp(
                    2rem,
                    5vw,
                    3.5rem
                );

            margin-bottom:
                15px;

        }


        .hero p {

            color:
                var(--muted);

            max-width:
                650px;

            margin:
                auto;

            font-size:
                1.1rem;

        }


        .primary-button {

            display:
                inline-block;

            margin-top:
                20px;

            padding:
                12px 22px;

            border: none;

            border-radius:
                8px;

            background:
                var(--primary);

            color:
                white;

            font-weight:
                bold;

        }


        .primary-button:hover {

            background:
                var(--primary-dark);

        }


        /* =========================
           SECTION TITLE
        ========================== */

        .section-title {

            text-align:
                center;

            margin-bottom:
                25px;

        }


        .section-title h2 {

            font-size:
                2rem;

        }


        .section-title p {

            color:
                var(--muted);

        }


        /* =========================
           FILTERS
        ========================== */

        .filters {

            background:
                var(--surface);

            padding:
                20px;

            border-radius:
                12px;

            border:
                1px solid var(--border);

            margin-bottom:
                25px;

            display:
                flex;

            gap:
                12px;

            flex-wrap:
                wrap;

        }


        .filters input,
        .filters select {

            padding:
                12px;

            border:
                1px solid var(--border);

            border-radius:
                8px;

            flex:
                1;

            min-width:
                200px;

        }


        /* =========================
           PRODUCTS
        ========================== */

        .product-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    4,
                    1fr
                );

            gap:
                20px;

        }


        .product-card {

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius:
                14px;

            overflow:
                hidden;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        .product-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 10px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

        }


        .product-image {

            width:
                100%;

            height:
                200px;

            object-fit:
                cover;

            background:
                #e2e8f0;

        }


        .product-info {

            padding:
                18px;

        }


        .product-category {

            font-size:
                0.8rem;

            color:
                var(--primary);

            font-weight:
                bold;

            text-transform:
                uppercase;

        }


        .product-info h3 {

            margin:
                7px 0;

        }


        .product-info p {

            color:
                var(--muted);

            font-size:
                0.9rem;

        }


        .price {

            font-size:
                1.25rem;

            font-weight:
                bold;

            margin:
                12px 0;

        }


        .product-actions {

            display:
                flex;

            gap:
                8px;

        }


        .product-actions button {

            flex:
                1;

            padding:
                10px;

            border:
                none;

            border-radius:
                7px;

            font-weight:
                bold;

        }


        .view-button {

            background:
                #e0e7ff;

            color:
                #3730a3;

        }


        .add-button {

            background:
                var(--primary);

            color:
                white;

        }


        /* =========================
           PRODUCT DETAILS
        ========================== */

        .details {

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius:
                15px;

            padding:
                30px;

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                35px;

        }


        .details img {

            width:
                100%;

            max-height:
                450px;

            object-fit:
                cover;

            border-radius:
                12px;

        }


        .details-content h1 {

            font-size:
                2.2rem;

            margin:
                10px 0;

        }


        .details-content .price {

            font-size:
                1.8rem;

            color:
                var(--primary);

        }


        /* =========================
           CART
        ========================== */

        .cart-container {

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius:
                15px;

            padding:
                25px;

        }


        .cart-item {

            display:
                flex;

            align-items:
                center;

            gap:
                20px;

            padding:
                18px 0;

            border-bottom:
                1px solid var(--border);

        }


        .cart-item img {

            width:
                80px;

            height:
                80px;

            object-fit:
                cover;

            border-radius:
                8px;

        }


        .cart-item-info {

            flex:
                1;

        }


        .quantity {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        .quantity button {

            width:
                30px;

            height:
                30px;

            border:
                1px solid var(--border);

            background:
                white;

            border-radius:
                5px;

        }


        .remove-button {

            background:
                var(--danger);

            color:
                white;

            border:
                none;

            padding:
                8px 12px;

            border-radius:
                6px;

        }


        .cart-total {

            text-align:
                right;

            margin-top:
                25px;

        }


        .cart-total h2 {

            margin-bottom:
                15px;

        }


        .empty {

            text-align:
                center;

            padding:
                50px 20px;

            color:
                var(--muted);

        }


        /* =========================
           NOT FOUND
        ========================== */

        .not-found {

            text-align:
                center;

            padding:
                80px 20px;

        }


        .not-found h1 {

            font-size:
                4rem;

        }


        /* =========================
           FOOTER
        ========================== */

        footer {

            background:
                var(--surface);

            border-top:
                1px solid var(--border);

            padding:
                25px;

            text-align:
                center;

            color:
                var(--muted);

        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 950px) {

            .product-grid {

                grid-template-columns:
                    repeat(
                        3,
                        1fr
                    );

            }

        }


        @media (max-width: 700px) {

            .navbar {

                flex-direction:
                    column;

            }


            .nav-links {

                justify-content:
                    center;

                flex-wrap:
                    wrap;

            }


            .product-grid {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );

            }


            .details {

                grid-template-columns:
                    1fr;

            }


            .cart-item {

                flex-wrap:
                    wrap;

            }

        }


        @media (max-width: 450px) {

            .product-grid {

                grid-template-columns:
                    1fr;

            }

            #app {

                padding:
                    25px 12px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <nav
            class="navbar"
            aria-label="Main navigation">

            <a
                href="#/"
                class="logo">

                ShopHub

            </a>


            <ul class="nav-links">

                <li>
                    <a href="#/">
                        Home
                    </a>
                </li>

                <li>
                    <a href="#/products">
                        Products
                    </a>
                </li>

            </ul>


            <button
                class="cart-button"
                onclick="Router.navigate('/cart')">

                🛒 Cart
                (<span id="cart-count">0</span>)

            </button>

        </nav>

    </header>


    <!-- =========================
         MAIN APPLICATION
    ========================== -->

    <main id="app"
          aria-live="polite">
    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>

            © 2026 ShopHub.
            Built with HTML, CSS and JavaScript.

        </p>

    </footer>


    <script>

        /* =====================================================
           PRODUCT DATA MODULE
        ===================================================== */

        const ProductData = {

            products: [

                {
                    id: 1,
                    name: "Wireless Headphones",
                    category: "Electronics",
                    price: 2499,
                    description:
                        "Comfortable wireless headphones with high-quality sound and long battery life.",
                    image:
                        "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=75"
                },

                {
                    id: 2,
                    name: "Smart Watch",
                    category: "Electronics",
                    price: 3999,
                    description:
                        "Modern smartwatch with fitness tracking and notification features.",
                    image:
                        "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=75"
                },

                {
                    id: 3,
                    name: "Running Shoes",
                    category: "Fashion",
                    price: 2999,
                    description:
                        "Lightweight running shoes designed for comfortable everyday use.",
                    image:
                        "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=75"
                },

                {
                    id: 4,
                    name: "Backpack",
                    category: "Fashion",
                    price: 1499,
                    description:
                        "Durable backpack suitable for college, travel and daily use.",
                    image:
                        "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=75"
                },

                {
                    id: 5,
                    name: "Mechanical Keyboard",
                    category: "Electronics",
                    price: 3299,
                    description:
                        "Responsive mechanical keyboard designed for productivity and gaming.",
                    image:
                        "https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=600&q=75"
                },

                {
                    id: 6,
                    name: "Coffee Mug",
                    category: "Home",
                    price: 499,
                    description:
                        "Simple ceramic coffee mug for home or office use.",
                    image:
                        "https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?auto=format&fit=crop&w=600&q=75"
                },

                {
                    id: 7,
                    name: "Desk Lamp",
                    category: "Home",
                    price: 999,
                    description:
                        "Minimal LED desk lamp suitable for study and work.",
                    image:
                        "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=600&q=75"
                },

                {
                    id: 8,
                    name: "Gaming Mouse",
                    category: "Electronics",
                    price: 1299,
                    description:
                        "Ergonomic gaming mouse with accurate tracking and programmable buttons.",
                    image:
                        "https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=600&q=75"
                }

            ],


            getById(id) {

                return this.products.find(
                    product =>
                        product.id === Number(id)
                );

            },


            getCategories() {

                return [
                    ...new Set(
                        this.products.map(
                            product =>
                                product.category
                        )
                    )
                ];

            }

        };


        /* =====================================================
           CART MODULE
        ===================================================== */

        const Cart = {

            items:
                JSON.parse(
                    localStorage.getItem(
                        "shophub-cart"
                    )
                ) || [],


            save() {

                localStorage.setItem(
                    "shophub-cart",
                    JSON.stringify(
                        this.items
                    )
                );

                this.updateCount();

            },


            add(productId) {

                const existing =
                    this.items.find(
                        item =>
                            item.id === productId
                    );


                if (existing) {

                    existing.quantity++;

                }

                else {

                    this.items.push({

                        id: productId,

                        quantity: 1

                    });

                }


                this.save();

                alert(
                    "Product added to cart!"
                );

            },


            remove(productId) {

                this.items =
                    this.items.filter(
                        item =>
                            item.id !== productId
                    );

                this.save();

                Router.refresh();

            },


            increase(productId) {

                const item =
                    this.items.find(
                        item =>
                            item.id === productId
                    );


                if (item) {

                    item.quantity++;

                }


                this.save();

                Router.refresh();

            },


            decrease(productId) {

                const item =
                    this.items.find(
                        item =>
                            item.id === productId
                    );


                if (!item) return;


                if (item.quantity > 1) {

                    item.quantity--;

                }

                else {

                    this.remove(productId);

                    return;

                }


                this.save();

                Router.refresh();

            },


            getTotal() {

                return this.items.reduce(

                    (total, item) => {

                        const product =
                            ProductData.getById(
                                item.id
                            );

                        return total +
                            (
                                product.price *
                                item.quantity
                            );

                    },

                    0

                );

            },


            getCount() {

                return this.items.reduce(

                    (total, item) =>
                        total +
                        item.quantity,

                    0

                );

            },


            updateCount() {

                const count =
                    document.getElementById(
                        "cart-count"
                    );

                if (count) {

                    count.textContent =
                        this.getCount();

                }

            }

        };


        /* =====================================================
           ROUTER MODULE
        ===================================================== */

        const Router = {

            routes: {},


            init() {

                window.addEventListener(
                    "hashchange",
                    () => this.refresh()
                );

                this.refresh();

            },


            navigate(path) {

                window.location.hash =
                    path;

            },


            refresh() {

                let path =
                    window.location.hash
                        .replace(
                            "#",
                            ""
                        );

                if (!path) {

                    path = "/";

                }


                const app =
                    document.getElementById(
                        "app"
                    );


                /* Product details route */

                if (
                    path.startsWith(
                        "/product/"
                    )
                ) {

                    const id =
                        path.split(
                            "/"
                        )[2];

                    Views.productDetails(
                        Number(id)
                    );

                    Cart.updateCount();

                    return;

                }


                /* Normal routes */

                switch (path) {

                    case "/":

                        Views.home();

                        break;


                    case "/products":

                        Views.products();

                        break;


                    case "/cart":

                        Views.cart();

                        break;


                    default:

                        Views.notFound();

                }


                Cart.updateCount();

            }

        };


        /* =====================================================
           VIEWS MODULE
        ===================================================== */

        const Views = {


            home() {

                document.getElementById(
                    "app"
                ).innerHTML = `

                    <section class="hero">

                        <h1>
                            Welcome to ShopHub
                        </h1>

                        <p>
                            Discover quality products
                            at affordable prices.
                            Browse our modern e-commerce
                            product catalog.
                        </p>

                        <a
                            href="#/products"
                            class="primary-button">

                            Shop Now

                        </a>

                    </section>


                    <section>

                        <div class="section-title">

                            <h2>
                                Featured Products
                            </h2>

                            <p>
                                Popular products from our store
                            </p>

                        </div>


                        <div
                            class="product-grid">

                            ${ProductData.products
                                .slice(0, 4)
                                .map(
                                    product =>
                                        Components.productCard(
                                            product
                                        )
                                )
                                .join("")}

                        </div>

                    </section>

                `;

            },


            products() {

                const categories =
                    ProductData.getCategories();


                document.getElementById(
                    "app"
                ).innerHTML = `

                    <section>

                        <div class="section-title">

                            <h1>
                                Products
                            </h1>

                            <p>
                                Browse our complete catalog
                            </p>

                        </div>


                        <div class="filters">

                            <input
                                type="search"
                                id="search"
                                placeholder="Search products..."
                                aria-label="Search products">


                            <select
                                id="category"
                                aria-label="Filter by category">

                                <option value="">
                                    All Categories
                                </option>

                                ${categories.map(
                                    category =>
                                        `<option value="${category}">
                                            ${category}
                                        </option>`
                                ).join("")}

                            </select>

                        </div>


                        <div
                            id="product-list"
                            class="product-grid">

                        </div>

                    </section>

                `;


                const render =
                    () => {

                        const search =
                            document
                                .getElementById(
                                    "search"
                                )
                                .value
                                .toLowerCase();


                        const category =
                            document
                                .getElementById(
                                    "category"
                                )
                                .value;


                        const filtered =
                            ProductData.products
                                .filter(
                                    product =>

                                        product.name
                                            .toLowerCase()
                                            .includes(
                                                search
                                            )

                                        &&

                                        (
                                            !category ||
                                            product.category ===
                                                category
                                        )
                                );


                        const list =
                            document
                                .getElementById(
                                    "product-list"
                                );


                        if (
                            filtered.length === 0
                        ) {

                            list.innerHTML = `

                                <div class="empty">

                                    <h2>
                                        No products found
                                    </h2>

                                    <p>
                                        Try another search.
                                    </p>

                                </div>

                            `;

                            return;

                        }


                        list.innerHTML =
                            filtered
                                .map(
                                    product =>
                                        Components.productCard(
                                            product
                                        )
                                )
                                .join("");

                    };


                document
                    .getElementById(
                        "search"
                    )
                    .addEventListener(
                        "input",
                        render
                    );


                document
                    .getElementById(
                        "category"
                    )
                    .addEventListener(
                        "change",
                        render
                    );


                render();

            },


            productDetails(id) {

                const product =
                    ProductData.getById(id);


                if (!product) {

                    this.notFound();

                    return;

                }


                document.getElementById(
                    "app"
                ).innerHTML = `

                    <section>

                        <div class="details">

                            <div>

                                <img
                                    src="${product.image}"
                                    alt="${product.name}"
                                    loading="lazy">

                            </div>


                            <div
                                class="details-content">

                                <small>
                                    ${product.category}
                                </small>

                                <h1>
                                    ${product.name}
                                </h1>

                                <p class="price">
                                    ₹${product.price.toLocaleString("en-IN")}
                                </p>

                                <p>
                                    ${product.description}
                                </p>


                                <button
                                    class="primary-button"
                                    onclick="Cart.add(${product.id})">

                                    Add to Cart

                                </button>


                                <br><br>


                                <a
                                    href="#/products"
                                    class="button">

                                    ← Back to Products

                                </a>

                            </div>

                        </div>

                    </section>

                `;

            },


            cart() {

                const app =
                    document.getElementById(
                        "app"
                    );


                if (Cart.items.length === 0) {

                    app.innerHTML = `

                        <section
                            class="empty">

                            <h1>
                                Your Cart is Empty
                            </h1>

                            <p>
                                Add some products to
                                your shopping cart.
                            </p>

                            <a
                                href="#/products"
                                class="primary-button">

                                Browse Products

                            </a>

                        </section>

                    `;

                    return;

                }


                const items =
                    Cart.items.map(
                        item => {

                            const product =
                                ProductData.getById(
                                    item.id
                                );


                            return `

                                <article
                                    class="cart-item">

                                    <img
                                        src="${product.image}"
                                        alt="${product.name}">


                                    <div
                                        class="cart-item-info">

                                        <h3>
                                            ${product.name}
                                        </h3>

                                        <p>
                                            ₹${product.price.toLocaleString("en-IN")}
                                        </p>

                                    </div>


                                    <div
                                        class="quantity">

                                        <button
                                            onclick="Cart.decrease(${product.id})"
                                            aria-label="Decrease quantity">

                                            −

                                        </button>


                                        <strong>
                                            ${item.quantity}
                                        </strong>


                                        <button
                                            onclick="Cart.increase(${product.id})"
                                            aria-label="Increase quantity">

                                            +

                                        </button>

                                    </div>


                                    <button
                                        class="remove-button"
                                        onclick="Cart.remove(${product.id})">

                                        Remove

                                    </button>

                                </article>

                            `;

                        }
                    ).join("");


                app.innerHTML = `

                    <section>

                        <div class="section-title">

                            <h1>
                                Shopping Cart
                            </h1>

                        </div>


                        <div
                            class="cart-container">

                            ${items}


                            <div
                                class="cart-total">

                                <h2>
                                    Total:
                                    ₹${Cart.getTotal()
                                        .toLocaleString("en-IN")}
                                </h2>


                                <button
                                    class="primary-button"
                                    onclick="checkout()">

                                    Proceed to Checkout

                                </button>

                            </div>

                        </div>

                    </section>

                `;

            },


            notFound() {

                document.getElementById(
                    "app"
                ).innerHTML = `

                    <section
                        class="not-found">

                        <h1>
                            404
                        </h1>

                        <h2>
                            Page Not Found
                        </h2>

                        <p>
                            The page you are looking
                            for does not exist.
                        </p>

                        <a
                            href="#/"
                            class="primary-button">

                            Go Home

                        </a>

                    </section>

                `;

            }

        };


        /* =====================================================
           COMPONENTS MODULE
        ===================================================== */

        const Components = {


            productCard(product) {

                return `

                    <article
                        class="product-card">


                        <img
                            class="product-image"
                            src="${product.image}"
                            alt="${product.name}"
                            loading="lazy">


                        <div
                            class="product-info">


                            <span
                                class="product-category">

                                ${product.category}

                            </span>


                            <h3>
                                ${product.name}
                            </h3>


                            <p>
                                ${product.description}
                            </p>


                            <div class="price">

                                ₹${product.price
                                    .toLocaleString("en-IN")}

                            </div>


                            <div
                                class="product-actions">


                                <button
                                    class="view-button"
                                    onclick="Router.navigate('/product/${product.id}')">

                                    View

                                </button>


                                <button
                                    class="add-button"
                                    onclick="Cart.add(${product.id})">

                                    Add

                                </button>


                            </div>


                        </div>

                    </article>

                `;

            }

        };


        /* =====================================================
           CHECKOUT
        ===================================================== */

        function checkout() {

            if (Cart.items.length === 0) {

                alert(
                    "Your cart is empty."
                );

                return;

            }


            alert(
                "Demo checkout successful! Thank you for shopping."
            );


            Cart.items = [];

            Cart.save();

            Router.navigate("/");

        }


        /* =====================================================
           APPLICATION START
        ===================================================== */

        Router.init();

        Cart.updateCount();

    </script>


</body>

</html>
